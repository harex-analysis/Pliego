name: Windows x64

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run setup:win
      - run: npm run test:win
      - run: npm run release:win
      - name: Verify and test extracted release
        shell: pwsh
        run: |
          $dist = Join-Path $PWD 'dist/release'
          foreach ($entry in Get-Content (Join-Path $dist 'SHA256SUMS.txt')) {
            $hash,$file = $entry -split '  ',2
            if ((Get-FileHash -LiteralPath (Join-Path $dist $file) -Algorithm SHA256).Hash -ne $hash) {
              throw "Unexpected SHA-256 for $file"
            }
          }
          $zip = Get-ChildItem $dist -Filter 'Pliego-*-windows-x64.zip' | Select-Object -First 1
          $out = Join-Path $env:RUNNER_TEMP 'pliego-portable'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $out
          $env:PLIEGO_TEST_EXE = Join-Path $out 'Pliego-win32-x64/Pliego.exe'
          npm run test:win
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: github.event_name != 'pull_request'
        with:
          name: Pliego-Windows-x64
          path: dist/release/
          if-no-files-found: error
