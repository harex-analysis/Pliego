name: Windows x64

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Verify the version on release tags
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'El tag no coincide con package.json.' }
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run setup:win
      - run: npm run test:win
      - run: npm run release:win
      - name: Verify and test the installer
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $dist = Join-Path $PWD "dist/release/v$version"
          foreach ($entry in Get-Content (Join-Path $dist 'SHA256SUMS.txt')) {
            $hash,$file = $entry -split '  ',2
            if ((Get-FileHash -LiteralPath (Join-Path $dist $file) -Algorithm SHA256).Hash -ne $hash) {
              throw "Unexpected SHA-256 for $file"
            }
          }
          & ./tests/installer.ps1 -Installer (Join-Path $dist 'Pliego-Setup-x64.exe')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: Pliego-Windows-x64
          path: dist/release/v*/
          if-no-files-found: error
